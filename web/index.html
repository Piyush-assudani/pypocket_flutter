  <style>
    /* Native Executive Preloader */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #F8FAFC;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app-preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, rgba(37, 99, 235, 0.08) 0%, rgba(248, 250, 252, 1) 70%);
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
    }

    .brand-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: floatChip 3s ease-in-out infinite alternate;
    }

    @keyframes floatChip {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    .chip-3d {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);
      box-shadow: 0 16px 36px -6px rgba(37, 99, 235, 0.42), 0 24px 48px -12px rgba(124, 58, 237, 0.25);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .chip-dot {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #FBBF24;
      box-shadow: 0 0 10px #FBBF24;
    }

    .chip-svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      margin-top: 22px;
      font-size: 34px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      margin-top: 8px;
      display: inline-block;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #2563EB;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.22);
      border-radius: 20px;
    }

    .progress-track {
      width: 260px;
      height: 6px;
      background: #E2E8F0;
      border-radius: 10px;
      margin-top: 36px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #2563EB 0%, #06B6D4 50%, #10B981 100%);
      border-radius: 10px;
      animation: indeterminateBar 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      transform-origin: 0% 50%;
    }

    @keyframes indeterminateBar {
      0% { transform: translateX(-100%) scaleX(0.2); }
      50% { transform: translateX(0%) scaleX(0.6); }
      100% { transform: translateX(100%) scaleX(1); }
    }

    .status-text {
      margin-top: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748B;
      letter-spacing: 0.2px;
    }
  </style>

<body>
  <!-- Native Executive Preloader -->
  <div id="app-preloader">
    <div class="brand-stage">
      <div class="chip-3d">
        <div class="chip-dot"></div>
        <svg class="chip-svg" viewBox="0 0 24 24">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <div class="brand-title">PyPocket</div>
      <div class="brand-badge">CPYTHON 3.12 • EXECUTIVE DEV SUITE</div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="status-text">Booting CPython 3.12 Runtime Engine...</div>
    </div>
  </div>

  <script>
    // Fade out preloader when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    });
    // Fallback: remove after 4.5s
    setTimeout(function () {
      var loader = document.getElementById('app-preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 500);
      }
    }, 4500);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
